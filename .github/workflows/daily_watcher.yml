name: Daily MetricWatcher AI Execution

on:
  schedule:
    # Runs every day at 08:00 UTC (Adjust cron expression as needed)
    - cron: "0 8 * * *"
  workflow_dispatch: # Enables manual "Run workflow" button in GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas openpyxl google-generativeai python-dotenv; fi

      - name: Execute MetricWatcher AI Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
        run: python data_processor.py

      - name: Commit Updated Audit Log Back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_history.json
